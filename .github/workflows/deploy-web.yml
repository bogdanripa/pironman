name: deploy-web
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-web.yml'

# Builds the shared static host (web/) — the container that serves every app's
# frontend bundle. Separate from deploy.yml (which builds paas-api itself) and
# path-filtered, so a change to one doesn't trigger a slow emulated arm64 build
# of the other.
#
#   image  = ghcr.io/bogdanripa/pironman-web
#   app id = web   (serves nothing on its own host; Traefik routes each app's
#                   frontend traffic to it — see ARCHITECTURE.md §9b)
#
# Unlike paas-api this deploys the secretless way: the box watches :latest and
# redeploys when the digest moves, so CI only pokes /refresh.

# One deploy at a time, newest wins — see deploy.yml.
concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  # The static host is the front door for every app that sleeps, so a regression
  # here takes the whole box down rather than one app. The test stands up the
  # real server against a fake Traefik and a fake Sablier and drives the paths
  # that have actually broken: a woken backend, a dead one (which must 502, not
  # quietly serve the homepage), SPA fallback, and SSE streaming.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.115.6 httpx==0.28.1 uvicorn==0.34.0
      - run: python web/tests/test_server.py

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Same PAT as deploy.yml: it owns the bogdanripa/* package namespace,
          # which avoids the package-linkage step a fresh GITHUB_TOKEN would need.
          password: ${{ secrets.GHCR_PAT }}

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bogdanripa/pironman-web:latest
            ghcr.io/bogdanripa/pironman-web:${{ steps.tag.outputs.value }}

      # WEB_PAAS_KEY is the `web` app's scoped deploy key — a different key from
      # PAAS_KEY in this repo, which is scoped to `api`. Tolerant of the app not
      # existing yet, so the first build can publish the image before it is
      # created. If this call fails the hourly sweep still deploys the image, so a
      # failure here delays the deploy rather than losing it.
      # The control plane redeploys itself often, and during that window Traefik
      # has no backend for it and answers 404 — the same transient that once made
      # this job green while nothing deployed. So retry briefly before believing
      # any answer, and only then decide.
      - name: Trigger deploy on the Pi
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ secrets.WEB_PAAS_KEY }}" \
              "https://api-coolify.bogdanripa.com/apps/web/refresh" || echo 000)
            case "$code" in
              2*) cat /tmp/out; echo; echo "deployed and verified ($code)"; exit 0 ;;
              404|000|502|503|504)
                  echo "attempt $i: $code — control plane may be restarting, retrying"
                  sleep 10 ;;
              401) echo "unauthorized — WEB_PAAS_KEY must be the 'web' app's deploy key"; exit 1 ;;
              *)   cat /tmp/out; echo; echo "refresh failed ($code)"; exit 1 ;;
            esac
          done
          cat /tmp/out; echo
          echo "gave up after 10 attempts (last: $code)."
          echo "502 means the deploy rolled back — check: apps_logs web"
          exit 1
