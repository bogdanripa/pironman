name: deploy-rag
on:
  push:
    branches: [main]
    paths:
      - 'rag/**'
      - '.github/workflows/deploy-rag.yml'

# Builds the RAG service (rag/) -- document ingest and hybrid retrieval.
# Path-filtered like deploy-web.yml so a change here does not trigger a slow
# emulated arm64 build of paas-api, or vice versa.
#
#   image  = ghcr.io/bogdanripa/pironman-rag
#   app id = rag
#
# Deploys the secretless way: the box watches :latest and redeploys when the
# digest moves, so CI only pokes /refresh.

concurrency:
  group: deploy-rag
  cancel-in-progress: true

jobs:
  # The guard in fetch.py is the security boundary of this service -- it takes
  # URLs from anonymous callers and runs on the machine hosting the platform, so
  # a regression there is an SSRF hole into the private network, not a bug. The
  # suite also covers the two silent-failure modes: a document that indexes
  # nothing while reporting ready, and a truncated document that answers queries
  # about its missing half without saying so.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install fastapi==0.115.6 httpx==0.28.1 numpy selectolax pypdf python-docx python-pptx
      - run: python rag/tests/test_rag.py

  deploy:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Same PAT as deploy.yml and deploy-web.yml: it owns the bogdanripa/*
          # package namespace, which avoids the package-linkage step a fresh
          # GITHUB_TOKEN would need.
          password: ${{ secrets.GHCR_PAT }}

      - id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - uses: docker/build-push-action@v6
        with:
          context: ./rag
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/bogdanripa/pironman-rag:latest
            ghcr.io/bogdanripa/pironman-rag:${{ steps.tag.outputs.value }}

      # RAG_PAAS_KEY is the `rag` app's own scoped deploy key -- not PAAS_KEY
      # (scoped to `api`) and not WEB_PAAS_KEY. The control plane redeploys
      # itself often and answers 404 or 5xx while it restarts, so transient
      # codes are retried rather than believed. 500 is in that list for the same
      # reason it is in the generated workflow: an app with a consistent
      # container name stops the old container before starting the new, and the
      # edge answers 500 across that gap.
      #
      # The body carries the image, and that is not optional: `rag` is
      # registered as a bare id, so the FIRST /refresh is what creates its
      # container -- and a call with no image is answered 400, "this app has no
      # backend yet". That is why rag had never deployed; the 400 at 10:47 on
      # 2026-08-23 was this step, not a transient.
      - name: Trigger deploy on the Pi
        id: refresh
        run: |
          for i in $(seq 1 10); do
            code=$(curl -sS -o /tmp/out -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${{ secrets.RAG_PAAS_KEY }}" \
              -H "Content-Type: application/json" \
              -d '{"image":"ghcr.io/bogdanripa/pironman-rag:latest"}' \
              "https://api-coolify.bogdanripa.com/apps/rag/refresh" || echo 000)
            case "$code" in
              2*) cat /tmp/out; echo
                  python3 -c "import json;print('id='+json.load(open('/tmp/out')).get('deploy',''))" \
                    >> $GITHUB_OUTPUT
                  exit 0 ;;
              404|000|500|502|503|504)
                  echo "attempt $i: $code — control plane may be restarting, retrying"
                  sleep 10 ;;
              401) echo "unauthorized — RAG_PAAS_KEY must be the 'rag' app's deploy key"; exit 1 ;;
              *)   cat /tmp/out; echo; echo "refresh failed ($code)"; exit 1 ;;
            esac
          done
          cat /tmp/out; echo
          echo "gave up after 10 attempts (last: $code)"
          exit 1

      # 202 above means QUEUED, not deployed -- the hook cannot wait for the
      # verification, because Cloudflare cuts the request at ~100s. This is
      # where the deploy passes or fails, and for `rag` it is the ONLY place it
      # can: rag is an internal service with no public hostname, so there is no
      # health URL to poll as a second opinion. A rollback leaves the previous
      # container serving and is invisible from anywhere else.
      - name: Wait for the deploy to be verified
        run: |
          url="https://api-coolify.bogdanripa.com/apps/rag/refresh?deploy=${{ steps.refresh.outputs.id }}"
          for i in $(seq 1 60); do
            body=$(curl -sS -H "Authorization: Bearer ${{ secrets.RAG_PAAS_KEY }}" "$url" || echo '{}')
            state=$(printf '%s' "$body" | python3 -c "import json,sys;print(json.load(sys.stdin).get('state',''))" 2>/dev/null || echo)
            case "$state" in
              succeeded) echo "deploy verified on the box"; exit 0 ;;
              failed) printf '%s\n' "$body"
                      echo "the new container never came up healthy, so Coolify rolled it"
                      echo "back — check: apps_logs rag"
                      exit 1 ;;
              running|"") sleep 5 ;;
              unknown) printf '%s\n' "$body"
                       echo "::error::the box lost track of this deploy, and rag has no"
                       echo "public health path to fall back on — check apps_logs rag"
                       exit 1 ;;
            esac
          done
          echo "::error::no verdict after 5 minutes — check: apps_logs rag"
          exit 1
