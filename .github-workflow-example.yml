# Reference only — a minimal illustration of the shape. Get the real thing from
# apps_deploy_workflow, which fills in the app id, the branch to deploy from, the
# app's health path and the verified-deploy retry logic that this file omits.
name: deploy
on:
  push:
    # The branch that deploys. Not always main: a feature branch wired to main
    # builds nothing, and the run that looks missing is one that never triggered.
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64        # the Pi is aarch64 — without this the
          push: true                    # image builds amd64 and will not start
          tags: ghcr.io/bogdanripa/${{ github.event.repository.name }}:latest
      # The box watches :latest and redeploys when the digest moves; this triggers
      # the check now instead of waiting for the hourly sweep. PAAS_KEY is the
      # app's scoped deploy key — it can only deploy this one app.
      #
      # This answers 202 = QUEUED, not deployed. The real thing the omitted
      # retry logic does is poll GET /apps/<id>/refresh?deploy=<id> afterwards
      # for the box's verdict, which is the only way to catch a deploy Coolify
      # rolled back — a rollback leaves the PREVIOUS container serving, so the
      # app answers its healthcheck while running the old code. Get the real
      # workflow from apps_deploy_workflow rather than copying this.
      - name: Trigger deploy
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.PAAS_KEY }}" \
            "https://api-coolify.bogdanripa.com/apps/${{ github.event.repository.name }}/refresh"
