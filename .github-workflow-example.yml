# Copy into each managed app's repo as .github/workflows/deploy.yml
name: deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64        # the Pi is aarch64 — without this the
          push: true                    # image builds amd64 and will not start
          tags: ghcr.io/bogdanripa/${{ github.event.repository.name }}:latest
      - name: Redeploy
        run: |
          curl -fsS -X PUT \
            "https://api-coolify.bogdanripa.com/apps/${{ github.event.repository.name }}/code" \
            -H "Authorization: Bearer ${{ secrets.PAAS_KEY }}" \
            -H 'Content-Type: application/json' \
            -d '{"image":"ghcr.io/bogdanripa/${{ github.event.repository.name }}:latest"}'
