# Copy into each managed app's repo as .github/workflows/deploy.yml
name: deploy
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          platforms: linux/arm64        # the Pi is aarch64 — without this the
          push: true                    # image builds amd64 and will not start
          tags: ghcr.io/bogdanripa/${{ github.event.repository.name }}:latest
      # No secret: the box watches :latest and redeploys when the image changes.
      # This just triggers it now instead of waiting for the hourly poll.
      - name: Trigger deploy
        run: |
          curl -fsS -X POST \
            "https://api-coolify.bogdanripa.com/apps/${{ github.event.repository.name }}/refresh"
